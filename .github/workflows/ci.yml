name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  rust:
    name: Rust Check & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features

      - name: Build
        run: cargo build --all-targets

      - name: Unit tests
        run: cargo test --all

      - name: Build release binary
        run: cargo build --release --bin opal

      - name: Spec tests
        run: OPAL_BIN="./target/release/opal" ./tests/run_spec.sh

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Run tests with coverage instrumentation
        run: cargo llvm-cov --all-features --workspace --no-report

      - name: Generate HTML report
        run: cargo llvm-cov report --html

      - name: Generate lcov report
        run: cargo llvm-cov report --lcov --output-path lcov.info

      - name: Upload coverage HTML report
        uses: actions/upload-artifact@v5
        with:
          name: coverage-html
          path: target/llvm-cov/html/
          retention-days: 30

      - name: Upload lcov.info
        uses: actions/upload-artifact@v5
        with:
          name: coverage-lcov
          path: lcov.info
          retention-days: 30

  tree-sitter:
    name: Tree-sitter Grammar Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: cd tree-sitter-opal && pnpm install

      - name: Generate parser
        run: cd tree-sitter-opal && pnpm run generate

      - name: Run tree-sitter tests
        run: cd tree-sitter-opal && pnpm run test
